</g>
<g font-family="Arial" font-size="15" fill="#26384f">
<text x="380" y="218">1</text><text x="430" y="218">0..*</text><text x="766" y="218">1</text><text x="812" y="218">1..*</text>
<text x="615" y="420">1</text><text x="235" y="493">1..*</text><text x="380" y="612">1</text><text x="430" y="612">1</text>
<text x="800" y="610">inheritance</text>
</g>
<text x="70" y="835" font-family="Arial" font-size="17" fill="#43546b">Legend: solid arrow = association / navigability; hollow triangle = inheritance</text>
<text x="70" y="865" font-family="Arial" font-size="15" fill="#43546b">Order contains one or more OrderItems; each OrderItem references one Drink. Payment types inherit from Payment.</text>
</svg>