<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 Library System</h1>
    <p>ระบบจัดการข้อมูลหนังสือด้วย RESTful API</p>
  </header>

  <main>
    <section class="card">
      <h2>ค้นหาหนังสือจาก ISBN</h2>
      <div class="search-box">
        <input id="searchIsbn" type="text" placeholder="กรอก ISBN">
        <button onclick="searchBook()">ค้นหา</button>
        <button class="secondary" onclick="loadBooks()">แสดงทั้งหมด</button>
      </div>
      <div id="searchResult"></div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>รายชื่อหนังสือทั้งหมด</h2>
        <span id="bookCount"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ISBN</th>
              <th>ชื่อหนังสือ</th>
              <th>ผู้แต่ง</th>
              <th>ปี</th>
              <th>สำนักพิมพ์</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="bookTable"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>เพิ่มข้อมูลหนังสือ</h2>
      <form id="bookForm">
        <div class="form-grid">
          <input name="isbn" placeholder="ISBN" required>
          <input name="title" placeholder="ชื่อหนังสือ" required>
          <input name="author" placeholder="ผู้แต่ง" required>
          <input name="year" type="number" placeholder="ปี" required>
          <input name="publisher" placeholder="สำนักพิมพ์" required>
        </div>
        <button type="submit">➕ เพิ่มหนังสือ</button>
      </form>
      <p id="formMessage"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
